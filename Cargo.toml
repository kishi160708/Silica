[workspace]
resolver = "2"
members = [
    "crates/",
    "crates/-vault",
    "crates/-markdown",
    "crates/-cache",
    "crates/-formats",
    "crates/-commands",
    "crates/-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/lw-xiong/"
license = "MIT"
publish = false

[workspace.dependencies]
-vault = { path = "crates/-vault" }
-markdown = { path = "crates/-markdown" }
-cache = { path = "crates/-cache" }
-formats = { path = "crates/-formats" }
-commands = { path = "crates/-commands" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
walkdir = "2"
tempfile = "3"
rayon = "1"
# Cargo.lock pins libc to 0.2.189: gpui 0.2.2 -> gpui_http_client -> zed-async-tar -> xattr 0.2.3
# reads `libc::ENOATTR`, which libc 0.2.190 removed on Linux. Drop the pin once gpui moves to xattr 1.x.
gpui = "0.2.2"

[profile.dev]
opt-level = 0

# gpui and its graphics stack are slow at opt-level 0; keep dependencies optimized in debug builds.
[profile.dev.package."*"]
opt-level = 2
