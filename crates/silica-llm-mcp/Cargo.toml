[package]
name = "silica-llm-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "silica-llm-mcp"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
libc = "0.2"
# Blocking TLS for `https://` model-server endpoints. native-tls uses the
# operating system's native trust store (no bundled root store, no async
# runtime), so a remote model server can be reached over an encrypted
# connection.
native-tls = "0.2"
