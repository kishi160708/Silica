name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev libssl-dev pkg-config \
            libvulkan1 mesa-vulkan-drivers libgbm-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # A debug build of the editor is large; the link step needs room.
      - name: Build
        run: cargo build --workspace --all-targets

      # The workspace suite, including the graphical end-to-end tests on a
      # runner that has a display. Windows is where the `openat`-only write
      # path does not apply, so its suite is the one that proves the fallback
      # still holds.
      - name: Test
        run: cargo test --workspace

      # Clippy is a blocking gate: a warning means the change does not ship.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  gui:
    name: gui end-to-end (linux, xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev libssl-dev pkg-config \
            libvulkan1 mesa-vulkan-drivers libgbm-dev libasound2-dev xvfb

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The e2e tests drive the real binary over its control socket and need a
      # display. They run by default when one exists (no SILICA_E2E gate), so
      # this job proves the GUI workflows instead of skipping them.
      - name: End-to-end
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" cargo test -p silica --test e2e -- --test-threads=1 --nocapture

  audit:
    name: supply chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
